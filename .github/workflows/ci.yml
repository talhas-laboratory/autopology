name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  linux-full:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26
        env:
          NEO4J_AUTH: neo4j/autopology_dev_pw
        ports:
          - 7474:7474
          - 7687:7687
    env:
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: autopology_dev_pw
      NEO4J_DATABASE: neo4j
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Neo4j
        run: |
          for i in {1..60}; do
            if (echo > /dev/tcp/127.0.0.1/7687) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Neo4j did not become ready in time"
          exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Neo4j integration tests
        run: npm run test:neo4j

      - name: Build
        run: npm run build

      - name: Verify npm pack boundaries
        run: npm run release:pack:verify

  macos-smoke:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify npm pack boundaries
        run: npm run release:pack:verify
