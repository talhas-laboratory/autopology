services:
  neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/autopology_dev_pw
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  autopology:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: autopology-dev:local
    command: ["doctor", "--repo", "/workspace"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: autopology_dev_pw
      NEO4J_DATABASE: neo4j
    volumes:
      - ./:/workspace
    depends_on:
      neo4j:
        condition: service_started

volumes:
  neo4j_data:
